  <text x="292" y="185" class="title">How are refresh tokens validated?</text>
  <text x="292" y="207" class="small muted">Answers grounded in the selected repository</text>

  <rect x="472" y="229" width="636" height="59" rx="14" fill="#19243A" stroke="#2B3852"/>
  <text x="1084" y="263" text-anchor="end" class="body">How does the API validate a refresh token?</text>
  <circle cx="1090" cy="250" r="10" fill="#33415F"/>
  <text x="1090" y="254" text-anchor="middle" font-size="8" font-weight="700">EL</text>

  <rect x="292" y="316" width="26" height="26" rx="8" fill="url(#brand)"/>
  <path d="M299 323h6a3 3 0 0 1 0 6h-6v-6Zm0 6h7a3 3 0 0 1 0 6h-7v-6Z" fill="#101426"/>
  <text x="327" y="328" class="small" font-weight="650">RepoGuide</text>
  <text x="399" y="328" font-size="10" class="muted">· Answered from code</text>
  <text x="292" y="367" class="body">The refresh token is checked in <tspan fill="#B8ADFF" font-family="Consolas, monospace">JwtAuthGuard</tspan> before the request</text>
  <text x="292" y="391" class="body">reaches its controller. The guard verifies the token signature and</text>
  <text x="292" y="415" class="body">expiration, then attaches the decoded user claims to the request.</text>

  <rect x="292" y="438" width="590" height="54" rx="9" fill="#111B2D" stroke="#2B3852"/>
  <rect x="305" y="451" width="27" height="27" rx="7" fill="#19263A"/>
  <path d="M312 457h8l3 3v11h-11v-14Zm7 0v4h4" fill="none" stroke="#A6B4D2" stroke-width="1.1" stroke-linejoin="round"/>
  <text x="342" y="461" font-size="11" font-family="Consolas, monospace" fill="#BFB7FF">src/auth/jwt-auth.guard.ts</text>
  <text x="342" y="478" font-size="10" class="muted">Lines 18–42</text>
  <path d="m857 459 4 4-4 4" fill="none" stroke="#74819A" stroke-width="1.4"/>

  <text x="292" y="531" class="body">The token is also checked against the account state. If it is expired</text>
  <text x="292" y="555" class="body">or invalid, the guard rejects the request with an unauthorized response.</text>
  <rect x="292" y="578" width="590" height="54" rx="9" fill="#111B2D" stroke="#2B3852"/>
  <rect x="305" y="591" width="27" height="27" rx="7" fill="#19263A"/>
  <path d="M312 597h8l3 3v11h-11v-14Zm7 0v4h4" fill="none" stroke="#A6B4D2" stroke-width="1.1" stroke-linejoin="round"/>
  <text x="342" y="601" font-size="11" font-family="Consolas, monospace" fill="#BFB7FF">src/auth/auth.service.ts</text>
  <text x="342" y="618" font-size="10" class="muted">Lines 74–91</text>
